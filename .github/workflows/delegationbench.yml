name: Agent security (DelegationBench)
on:
  push:
    branches: [main]
permissions:
  contents: read
  security-events: write
jobs:
  delegation-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: sergeyizmailov/DelegationBench@v0.4.4
        with:
          scenarios: scenarios
          defense: envelope
          upload-sarif: "true"
