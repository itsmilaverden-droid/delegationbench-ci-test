name: DelegationBench gate demo (expected to fail)
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  gate-demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: sergeyizmailov/DelegationBench@v0.4.5
        with:
          scenarios: regression/tampered-attack-001.yaml
          defense: none
